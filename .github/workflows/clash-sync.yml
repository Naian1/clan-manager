name: Clash sync

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Sync mode
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Select sync mode
        id: mode
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          MODE="fast"
          if [ "$EVENT_SCHEDULE" = "17 */4 * * *" ] || [ "$MANUAL_MODE" = "full" ]; then
            MODE="full"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Request GitHub OIDC token
        id: oidc
        run: |
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=clan-manager-sync")
          TOKEN=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Call protected sync endpoint
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          if [ "$MODE" = "full" ]; then
            URL="https://clan-manager-five.vercel.app/api/sync"
          else
            URL="https://clan-manager-five.vercel.app/api/sync/war"
          fi

          echo "Running $MODE sync"
          curl --fail-with-body --retry 2 --retry-delay 5 \
            -X POST "$URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json"
